<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MadeInWeb</title>
<meta name="description" content="数秒のミニゲームを連続で遊ぶWebゲーム">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MadeInWeb">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="version.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  body { box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  #screen { position: relative; aspect-ratio: 9 / 16;
    height: min(100%, calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 16 / 9));
    background: #000; overflow: hidden; container-type: size; }
  #stage { position: absolute; inset: 0; overflow: hidden; will-change: transform; }
  #curtain { will-change: transform; }
  iframe.game { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #fff; }
  .hidden { display: none !important; }

  #timer { position: absolute; left: 5%; right: 5%; bottom: 2.5%; height: 1.4cqh; border-radius: 1cqh;
    background: rgba(0, 0, 0, .25); overflow: hidden; pointer-events: none; }
  #timer-bar { width: 100%; height: 100%; background: #f3a712; transform-origin: left center; }

  #instruction { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none;
    font-size: 12cqw; font-weight: 900; line-height: 1.1; color: #fff;
    -webkit-text-stroke: 1cqw #222; paint-order: stroke fill; opacity: 0; }
  #instruction.show { animation: pop 1.3s ease-out forwards; }
  @keyframes pop {
    0% { opacity: 0; transform: scale(.3); }
    12% { opacity: 1; transform: scale(1.15); }
    22% { transform: scale(1); }
    75% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.05); }
  }

  #mark { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 50cqw; font-weight: 900; pointer-events: none;
    -webkit-text-stroke: 1.2cqw #fff; paint-order: stroke fill; }
  #mark span { display: block; }
  #mark.win { color: #e4572e; }
  #mark.lose { color: #3d5a80; }
  #mark.win span { animation: markpop .35s cubic-bezier(.3, 1.6, .5, 1); }
  #mark.lose span { animation: markdrop .5s cubic-bezier(.3, 1.4, .5, 1); }
  #mark.win span.beat { animation: markbeat .25s ease-out; }
  #mark.lose span.beat { animation: markwobble .3s ease-out; }
  @keyframes markpop { from { transform: scale(0.2) rotate(-20deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes markdrop { from { transform: translateY(-80cqh) rotate(25deg); } to { transform: translateY(0); } }
  @keyframes markbeat { from { transform: scale(1.18); } to { transform: scale(1); } }
  @keyframes markwobble { 0% { transform: rotate(0); } 30% { transform: rotate(-7deg); } 65% { transform: rotate(5deg); } 100% { transform: rotate(0); } }

  /* ---- 演出 ---- */
  #shaker { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #confetti, #crack { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #crack path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: crackdraw .18s ease-out forwards; }
  @keyframes crackdraw { to { stroke-dashoffset: 0; } }
  #countdown { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; pointer-events: none;
    font-size: 14cqh; font-weight: 900; line-height: 1; color: #fff; -webkit-text-stroke: 1.2cqw #e4572e;
    paint-order: stroke fill; opacity: 0; }
  #countdown.tick { animation: counttick .5s ease-out forwards; }
  @keyframes counttick { 0% { opacity: 0; transform: scale(2); } 15% { opacity: 1; transform: scale(1); } 70% { opacity: 1; } 100% { opacity: 0; transform: scale(.85); } }
  /* 導火線の火花（タイマーの先端） */
  #spark { position: absolute; bottom: calc(2.5% + 0.7cqh); width: 4cqh; height: 4cqh; margin: 0 0 -2cqh -2cqh;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, #fff 0 18%, #ffd25a 30%, rgba(255, 120, 40, .7) 50%, rgba(255, 80, 0, 0) 70%);
    animation: flicker .12s steps(2) infinite; }
  @keyframes flicker { 0% { transform: scale(1) rotate(0); } 100% { transform: scale(1.25) rotate(45deg); } }
  #timer.urgent #timer-bar { background: #e4572e; }
  #timer.urgent.beat { animation: timerbeat .25s ease-out; }
  @keyframes timerbeat { from { transform: scaleY(2.2); } to { transform: scaleY(1); } }

  #curtain { position: absolute; inset: 0; background: var(--curtain-bg, #fdf6e3); color: #333; pointer-events: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2cqh;
    overflow: hidden; transition: background-color .3s; }
  #c-title, #c-main, #c-sub, #c-bpm { position: relative; z-index: 1; }
  #c-bpm { font-size: 2.4cqh; font-weight: 800; color: #b08a4a; letter-spacing: .08em; }
  /* スピードアップの集中線 */
  #curtain > #speedlines { position: absolute; z-index: 0; inset: -60%; display: none;
    background: repeating-conic-gradient(from 0deg, rgba(228, 87, 46, .22) 0deg 3deg, transparent 3deg 11deg);
    animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #curtain.speedup > #speedlines { display: block; }
  #curtain.speedup #c-sub { font-size: 6cqh; font-weight: 900; color: #e4572e; letter-spacing: .04em;
    -webkit-text-stroke: .5cqw #fff; paint-order: stroke fill; animation: speedshake .12s linear infinite; }
  #curtain.speedup #c-bpm { font-size: 4.4cqh; color: #333; }
  @keyframes speedshake { 0% { transform: translate(0, 0); } 50% { transform: translate(.4cqw, -.3cqw); } 100% { transform: translate(-.3cqw, .3cqw); } }
  #c-title { font-size: 5cqh; font-weight: 800; letter-spacing: .05em; color: #e4572e; }
  #c-main { font-size: 16cqh; font-weight: 900; line-height: 1; }
  #c-sub { font-size: 3cqh; font-weight: 700; white-space: pre-wrap; text-align: center; padding: 0 6%; overflow-wrap: anywhere; }
  #c-hint { position: absolute; bottom: 8%; left: 4%; right: 4%; text-align: center; font-size: 2.2cqh; color: #888; z-index: 1; }
  #curtain div:empty:not(#speedlines) { display: none; }
  #c-main.pulse { animation: beatpulse .25s ease-out; }
  @keyframes beatpulse { from { transform: scale(1.18); } to { transform: scale(1); } }

  /* ---- ボタン・メニュー ---- */
  .btn { font: inherit; font-weight: 800; font-size: 3cqh; border: 0; border-radius: 2.4cqh; padding: 1.6cqh 3cqh;
    background: #fff; color: #e4572e; box-shadow: 0 .6cqh 0 rgba(0, 0, 0, .15); cursor: pointer; touch-action: manipulation; }
  .btn:active { transform: translateY(.4cqh); box-shadow: 0 .2cqh 0 rgba(0, 0, 0, .15); }
  .btn.primary { background: #e4572e; color: #fff; font-size: 3.6cqh; padding: 2cqh 7cqh; }
  .btn.small { font-size: 2.2cqh; padding: 1cqh 2.2cqh; border-radius: 1.6cqh; }
  #title-menu { position: absolute; left: 0; right: 0; bottom: 14%; display: flex; flex-direction: column; align-items: center; gap: 2.4cqh; }
  #curtain > #btn-quit { position: absolute; top: 1.5cqh; left: 3cqw; z-index: 2; }
  #select { position: absolute; inset: 0; box-sizing: border-box; background: #fdf6e3; color: #333;
    display: flex; flex-direction: column; gap: 1cqh; padding: 2cqh 4cqw 0; }
  .sel-head { display: flex; align-items: center; gap: 3cqw; }
  .sel-title { font-size: 3.4cqh; font-weight: 900; color: #e4572e; }
  .sel-label { font-size: 2cqh; font-weight: 800; color: #a07c3b; margin-top: .8cqh; }
  .seg { display: flex; gap: 1.5cqw; }
  .seg button { flex: 1; font: inherit; font-weight: 800; font-size: 2cqh; padding: 1.2cqh 0; border-radius: 1.4cqh;
    border: .3cqh solid #e4572e; background: #fff; color: #e4572e; touch-action: manipulation; }
  .seg button.on { background: #e4572e; color: #fff; }
  #sel-list { flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; display: grid;
    grid-template-columns: 1fr 1fr; gap: 2cqw; align-content: start; padding-bottom: 3cqh; }
  .card { font: inherit; text-align: left; border: 0; border-radius: 2cqh; background: #fff; padding: 1.6cqh 3cqw;
    box-shadow: 0 .5cqh 0 rgba(0, 0, 0, .1); color: #333; touch-action: manipulation; }
  .card:active { transform: translateY(.3cqh); }
  .card .ins { font-size: 3cqh; font-weight: 900; color: #e4572e; }
  .card .name { font-size: 2cqh; font-weight: 800; margin-top: .4cqh; }
  .card .meta { font-size: 1.6cqh; color: #999; margin-top: .3cqh; }

  /* ---- つくる ---- */
  #make { position: absolute; inset: 0; box-sizing: border-box; background: #fdf6e3; color: #333;
    display: flex; flex-direction: column; gap: 1cqh; padding: 2cqh 4cqw 0;
    -webkit-user-select: text; user-select: text; }
  #mk-body { flex: 1; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: .8cqh; padding-bottom: 2cqh; }
  #mk-body > .btn, .mk-row .btn { align-self: flex-start; }
  .mk-help { font-size: 1.9cqh; line-height: 1.5; color: #555; }
  #make textarea { box-sizing: border-box; width: 100%; height: 34cqh; flex: none; resize: vertical;
    font: 16px/1.35 ui-monospace, Menlo, Consolas, monospace; padding: 1cqh 2cqw;
    border: .3cqh solid #e8d9b5; border-radius: 1.4cqh; background: #fff; color: #222;
    touch-action: auto; -webkit-user-select: text; user-select: text; white-space: pre; overflow: auto; }
  #make textarea.short { height: 17cqh; }
  #make textarea#mk-out { height: 14cqh; font-size: 12px; }
  #make textarea:focus { outline: none; border-color: #e4572e; }
  .mk-row { display: flex; gap: 2cqw; flex-wrap: wrap; }
  .btn.zip { background: #e4572e; color: #fff; }
  #mk-file { display: none; }
  #mk-files { font: 1.7cqh/1.5 ui-monospace, Menlo, Consolas, monospace; color: #666; white-space: pre-wrap; overflow-wrap: anywhere; }
  #mk-files:empty::before { content: 'なし'; font-family: system-ui, sans-serif; color: #aaa; }
  #mk-log { font: 1.6cqh/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere;
    max-height: 24cqh; overflow-y: auto; background: #fff0ec; color: #8a2a12; border-radius: 1.2cqh; padding: 1cqh 2cqw; margin-bottom: .6cqh; }
  #mk-log-box { display: flex; flex-direction: column; gap: .6cqh; }
  .mk-foot { display: flex; flex-direction: column; align-items: center; gap: 1cqh; padding: 1.2cqh 0 2.4cqh; border-top: .2cqh solid #eee2c6; }
  #mk-msg { font-size: 1.9cqh; font-weight: 700; color: #c0392b; text-align: center; white-space: pre-wrap; min-height: 1em; }
  #mk-msg.ok { color: #2e8b57; }

  #version { position: absolute; top: 1.2cqh; right: 2cqw; font-size: 1.8cqh; color: #999; z-index: 60;
    padding: 0.5cqh 1cqw; user-select: none; -webkit-user-select: none; font-variant-numeric: tabular-nums; }
  #error { position: absolute; left: 3%; right: 3%; top: 4%; max-height: 40%; overflow: auto; padding: 8px;
    border-radius: 6px; background: rgba(150, 0, 0, .92); color: #fff; font: 11px/1.4 monospace;
    white-space: pre-wrap; pointer-events: auto; }

  #rotate { display: none; position: fixed; inset: 0; background: #111; color: #fff;
    align-items: center; justify-content: center; font-size: 24px; font-weight: 700; }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="screen">
  <!-- ゲーム画面。iframe・タイマー・指示・○× をまとめてスワイプで動かす -->
  <div id="stage">
    <div id="shaker">
      <!-- ここにサンドボックス iframe が入る -->
      <div id="flash"></div>
      <svg id="crack" viewBox="0 0 100 178" preserveAspectRatio="none"></svg>
      <canvas id="confetti"></canvas>
      <div id="timer" class="hidden"><div id="timer-bar"></div></div>
      <div id="spark" class="hidden"></div>
      <div id="countdown"></div>
      <div id="instruction"></div>
      <div id="mark" class="hidden"><span></span></div>
    </div>
  </div>
  <div id="curtain">
    <div id="speedlines"></div>
    <div id="c-title"></div>
    <div id="c-main"></div>
    <div id="c-sub"></div>
    <div id="c-bpm"></div>
    <div id="c-hint"></div>
    <button id="btn-quit" class="btn small hidden">◀ メニュー</button>
  </div>
  <!-- タイトルのボタン -->
  <div id="title-menu" class="hidden">
    <button id="btn-start" class="btn primary">スタート</button>
    <button id="btn-select" class="btn">えらんで遊ぶ</button>
    <button id="btn-make" class="btn small">つくる</button>
  </div>
  <!-- えらんで遊ぶ：ミニゲーム・スピード・難易度を選ぶ -->
  <div id="select" class="hidden">
    <div class="sel-head"><button id="sel-back" class="btn small">◀ もどる</button><div class="sel-title">えらんで遊ぶ</div></div>
    <div class="sel-label">スピード</div><div id="sel-speed" class="seg"></div>
    <div class="sel-label">難易度</div><div id="sel-diff" class="seg"></div>
    <div class="sel-label">ミニゲーム（タップでスタート）</div><div id="sel-list"></div>
  </div>
  <!-- つくる：AI に作ってもらったミニゲームを貼り付けて、その場で遊ぶ（host/make.js） -->
  <div id="make" class="hidden">
    <div class="sel-head"><button id="mk-back" class="btn small">◀ もどる</button><div class="sel-title">つくる</div></div>
    <div id="mk-body">
      <div class="mk-help">① 「AI への説明をコピー」して AI に貼り付け、作りたいゲームを書き足す<br>② AI が作った <b>zip</b> を読み込んで「あそぶ」<br>（zip がないときは、下に main.js と game.json を貼り付けても遊べます。ゲームはこのブラウザの中だけで動きます）</div>
      <div class="mk-row"><button id="mk-prompt" class="btn small">① AI への説明をコピー</button><label class="btn small zip" for="mk-file">② zip を読み込む</label></div>
      <div id="mk-log-box" class="hidden">
        <div class="sel-label">前回のエラー・注意</div>
        <div id="mk-log"></div>
        <button id="mk-copylog" class="btn small">エラーを AI 用にコピー</button>
      </div>
      <div class="sel-label">main.js</div>
      <textarea id="mk-code" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="export default {&#10;  init(ctx) { … },&#10;  update(dt, ctx) { … },&#10;};"></textarea>
      <div class="sel-label">game.json</div>
      <textarea id="mk-json" class="short" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      <div class="sel-label">素材ファイル（画像・音・VRM・glb。zip にまとめてもよい）</div>
      <div class="mk-row"><label class="btn small" for="mk-file">ファイルを追加</label><button id="mk-clear" class="btn small">すべて外す</button></div>
      <input id="mk-file" type="file" multiple>
      <div id="mk-files"></div>
      <div class="sel-label">スピード</div><div id="mk-speed" class="seg"></div>
      <div class="sel-label">難易度</div><div id="mk-diff" class="seg"></div>
    </div>
    <div class="mk-foot"><textarea id="mk-out" class="hidden" readonly></textarea><div id="mk-msg"></div><button id="mk-play" class="btn primary">▶ あそぶ</button></div>
  </div>
  <div id="version"></div>
  <div id="error" class="hidden"></div>
</div>
<div id="rotate">縦にしてください</div>
<script type="module" src="host/host.js"></script>
</body>
</html>
