<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MadeInWeb</title>
<meta name="description" content="数秒のミニゲームを連続で遊ぶWebゲーム">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MadeInWeb">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="version.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: none; }
  body { box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #screen { position: relative; aspect-ratio: 9 / 16;
    height: min(100%, calc((100vw - env(safe-area-inset-left) - env(safe-area-inset-right)) * 16 / 9));
    background: #fdf6e3; overflow: hidden; font-family: system-ui, sans-serif; container-type: size; }
  #label { position: absolute; top: 6%; width: 100%; text-align: center;
    font-size: 5cqh; font-weight: 700; color: #333; }
  #info { position: absolute; bottom: 4%; width: 100%; text-align: center; font-size: 2.2cqh; color: #666; }
  #version { position: absolute; top: 1.2cqh; right: 2cqw; font-size: 1.8cqh; color: #999;
    font-variant-numeric: tabular-nums; }
  .dot { position: absolute; width: 12cqw; height: 12cqw; margin: -6cqw 0 0 -6cqw;
    border-radius: 50%; background: #e4572e; pointer-events: none; }
  #rotate { display: none; position: fixed; inset: 0; background: #111; color: #fff;
    align-items: center; justify-content: center; font: 700 24px system-ui; }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="screen">
  <div id="version"></div>
  <div id="label">MadeInWeb</div>
  <div id="info">タップ・ドラッグしてみてください<br>540×960 論理座標: <span id="pos">-</span><br><span id="mode"></span></div>
</div>
<div id="rotate">縦にしてください</div>
<script>
  document.getElementById('version').textContent = 'v' + self.APP_VERSION;
  const standalone = matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true;
  document.getElementById('mode').textContent = standalone ? 'アプリとして起動中' : 'ブラウザで表示中';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(err => console.warn('SW registration failed', err));
  }

  const screen = document.getElementById('screen');
  const pos = document.getElementById('pos');
  const dots = new Map();
  const toLogical = e => {
    const r = screen.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * 540, y: (e.clientY - r.top) / r.height * 960 };
  };
  const place = (dot, e) => {
    const p = toLogical(e);
    dot.style.left = (p.x / 540 * 100) + '%';
    dot.style.top = (p.y / 960 * 100) + '%';
    pos.textContent = `${Math.round(p.x)}, ${Math.round(p.y)}`;
  };
  screen.addEventListener('pointerdown', e => {
    screen.setPointerCapture(e.pointerId);
    const d = document.createElement('div'); d.className = 'dot';
    screen.appendChild(d); dots.set(e.pointerId, d); place(d, e);
  });
  screen.addEventListener('pointermove', e => { const d = dots.get(e.pointerId); if (d) place(d, e); });
  const end = e => { const d = dots.get(e.pointerId); if (d) { d.remove(); dots.delete(e.pointerId); } };
  screen.addEventListener('pointerup', end);
  screen.addEventListener('pointercancel', end);
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
